name: Deploy Blazor WebAssembly to Github Pages

on:
  push:
    branches:
      - main # Ou sua branch escolhida

permissions:
  contents: write # Permite gravar o conteúdo do repositório
  pages: write # Permite escrever na branch de pages
  id-token: write # Necessário para autenticação OIDC (segurança)

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
    
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
    
      - name: Publish Blazor WebAssembly
        run: dotnet publish ./ScreenSound.WebAssembly.csproj --configuration Release --output ./build
    
      - name: Configure base href
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          sed -i "s|<base href=\"/\" />|<base href=\"/${REPO_NAME}/\" />|g" build/wwwroot/index.html
          grep '<base href=' build/wwwroot/index.html
    
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/wwwroot
